import net.fabricmc.loom.task.prod.ClientProductionRunTask

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven {
		name = 'covers1624'
		url = 'https://maven.covers1624.net/'
		content {
			includeGroup 'net.covers1624'
		}
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'Essential'
		url = 'https://repo.essential.gg/repository/maven-public'
		content {
			includeGroupByRegex 'gg\\.essential(\\..*)?'
			includeGroup 'com.github.videogame-hacker'
		}
	}
}

configurations {
	devLogin
	localRuntime.extendsFrom devLogin
	essentialContainer
}

loom {
	runs {
		client {
			mainClass = "net.covers1624.devlogin.DevLogin"
			programArgs "--launch_target", "net.fabricmc.loader.impl.launch.knot.KnotClient"
		}
	}
}

// Loom resolves modCompileOnly at configuration time, so the impl jars must exist without a task
// having run first; zipTree unpacks on demand instead of via a Sync task.
def essentialImpl = files({
	zipTree(configurations.essentialContainer.singleFile).matching {
		include "essential-*.jar"
		exclude "essential-loader*.jar"
	}
})

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "maven.modrinth:flashback:${project.flashback_version}"

	// gg.essential:essential-<mc>-fabric is unused: its classes duplicate the impl jar below, which trips tiny-remapper

	essentialContainer "maven.modrinth:essential:${project.essential_modrinth_version}"
	modCompileOnly essentialImpl

	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"

	productionRuntimeMods "maven.modrinth:essential:${project.essential_modrinth_version}"
	productionRuntimeMods "maven.modrinth:flashback:${project.flashback_version}"
	productionRuntimeMods "maven.modrinth:modmenu:${project.modmenu_version}"

	devLogin "net.covers1624:DevLogin:${project.devlogin_version}"
}


tasks.register("runProdClient", ClientProductionRunTask) {
	outputs.upToDateWhen { false }

	mods.from configurations.productionRuntimeMods
	mods.from tasks.named("jar")
	runDir = layout.projectDirectory.dir("run-prod")

	classpath.from configurations.devLogin
	mainClass = "net.covers1624.devlogin.DevLogin"
	programArgs.addAll("--launch_target", "net.fabricmc.loader.impl.launch.knot.KnotClient")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
